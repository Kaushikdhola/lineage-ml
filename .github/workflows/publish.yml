name: Publish token-xray

# Publishes xray/ to PyPI when a tag like xray-v0.1.0 is pushed. Uses PyPI Trusted Publishing: no API
# token is stored anywhere; PyPI trusts this workflow, in this repository, in the "pypi" environment.
# One-time setup on PyPI: a trusted publisher for this repository, publish.yml and the "pypi" environment.

on:
  push:
    tags: ["xray-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('xray/pyproject.toml','rb'))['project']['version'])")
          test "xray-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $v"; exit 1; }
      - name: Tests (CPU), including the transformers 4.45.2 hero run in its side environment
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "xray[dev,trl]"
          python -m venv .venv-hf445
          .venv-hf445/bin/pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          .venv-hf445/bin/pip install -r xray/requirements-hf445.txt
          cd xray && python -m pytest -q -rs
      - name: Build and check
        run: |
          pip install build twine
          python -m build xray -o dist
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/token-xray-ml/
    permissions:
      id-token: write # Trusted Publishing; the action also attaches signed provenance attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

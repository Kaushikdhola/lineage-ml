name: Deploy

# Builds the static site and publishes it to Cloudflare Pages on every push to main.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token scoped to "Cloudflare Pages: Edit" for one account only
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install numpy scipy statsmodels
      - run: npm ci
      - name: Verify and build (deploys only if every check passes)
        run: npm run ci
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lineage-ml --branch=main

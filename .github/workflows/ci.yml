name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python references
        run: pip install numpy scipy statsmodels
      - name: Install dependencies
        run: npm ci
      - name: Lint, format, type-check, verify against the oracle, build
        run: npm run ci

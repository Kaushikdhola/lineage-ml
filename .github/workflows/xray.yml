name: token-xray

# Runs the measurement suite against the real libraries on CPU, and re-exports the site's
# measurements nightly so the films always state the versions they were measured on.

on:
  push:
    branches: [main]
    paths: ["xray/**", ".github/workflows/xray.yml"]
  pull_request:
    paths: ["xray/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch, the package with TRL, and the transformers 4.45.2 side environment
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "xray[dev,trl]"
          python -m venv .venv-hf445
          .venv-hf445/bin/pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          .venv-hf445/bin/pip install -r xray/requirements-hf445.txt
      - name: Test
        working-directory: xray
        run: pytest -q
      - name: Report against the latest releases
        working-directory: xray
        run: token-xray report
      - name: Export measurements
        working-directory: xray
        run: token-xray export ../xray-data.json
      - uses: actions/upload-artifact@v4
        with:
          name: xray-data
          path: xray-data.json

  # Every planted fault must be caught and every test must catch one. About 25 minutes on CPU, so only
  # on main and nightly, not on pull requests.
  mutation:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch, the package with TRL, and the transformers 4.45.2 side environment
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "xray[dev,trl]"
          python -m venv .venv-hf445
          .venv-hf445/bin/pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          .venv-hf445/bin/pip install -r xray/requirements-hf445.txt
      - name: Mutation test
        run: python scripts/mutate.py

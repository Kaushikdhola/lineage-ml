[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "token-xray"
version = "0.1.0"
description = "See what your training stack actually does to every token: measured per-token gradient weights and cross-sequence gradient leaks, through the unmodified trainer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10.2"
dependencies = ["torch>=2.3", "transformers>=4.46", "numpy>=1.26"]

[project.optional-dependencies]
trl = ["trl>=1.0,<2"]
dev = ["pytest>=8"]

[project.scripts]
token-xray = "token_xray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
